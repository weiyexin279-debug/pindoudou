<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图纸生成器</title>
    <style>
/* 全局样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    overflow: hidden;
}

/* 头部 */
header {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    padding: 30px;
    text-align: center;
    color: white;
}

header h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

header .subtitle {
    font-size: 1.1rem;
    opacity: 0.9;
}

/* 主体 */
main {
    padding: 30px;
}

/* 上传区域 */
.upload-section {
    margin-bottom: 30px;
}

.upload-area {
    border: 3px dashed #ddd;
    border-radius: 15px;
    padding: 60px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: #fafafa;
}

.upload-area:hover {
    border-color: #667eea;
    background: #f0f0ff;
}

.upload-area.dragover {
    border-color: #667eea;
    background: #e0e0ff;
}

.upload-icon {
    font-size: 4rem;
    margin-bottom: 15px;
}

.upload-area p {
    color: #666;
    font-size: 1.1rem;
}

.preview-container {
    position: relative;
    text-align: center;
}

.preview-container img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}

.btn-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: #ff4757;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s;
}

.btn-remove:hover {
    transform: scale(1.1);
}

/* 设置区域 */
.settings-section {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 30px;
}

.settings-section h2 {
    margin-bottom: 20px;
    color: #333;
}

.setting-group {
    margin-bottom: 20px;
}

.setting-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #444;
}

.select-input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    background: white;
    cursor: pointer;
    transition: border-color 0.3s;
}

.select-input:focus {
    outline: none;
    border-color: #667eea;
}

.size-inputs {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.size-inputs input {
    flex: 1;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    text-align: center;
}

.size-inputs input:focus {
    outline: none;
    border-color: #667eea;
}

.size-inputs span {
    font-size: 1.2rem;
    color: #666;
}

.preset-sizes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.size-btn {
    padding: 8px 16px;
    border: 2px solid #ddd;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s;
}

.size-btn:hover {
    border-color: #667eea;
    background: #f0f0ff;
}

.size-btn.active {
    border-color: #667eea;
    background: #667eea;
    color: white;
}

.precision-btn {
    padding: 8px 16px;
    border: 2px solid #ddd;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s;
}

.precision-btn:hover {
    border-color: #764ba2;
    background: #f5f0ff;
}

.precision-btn.active {
    border-color: #764ba2;
    background: #764ba2;
    color: white;
}

.hint {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #888;
}

.checkbox-group {
    display: flex;
    gap: 20px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.checkbox-label input {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.button-group {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.btn-primary, .btn-secondary {
    flex: 1;
    padding: 15px 30px;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}

.btn-primary:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.btn-secondary {
    background: #eee;
    color: #333;
}

.btn-secondary:hover {
    background: #ddd;
}

/* 结果区域 */
.result-section {
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-section h2 {
    margin-bottom: 20px;
    color: #333;
}

.result-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
}

@media (max-width: 768px) {
    .result-preview {
        grid-template-columns: 1fr;
    }
}

.preview-box {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
}

.preview-box h3 {
    margin-bottom: 15px;
    color: #444;
}

.preview-box canvas {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
}

/* 材料清单 */
.material-list {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.material-list h3 {
    margin-bottom: 15px;
    color: #444;
}

.material-stats {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid #ddd;
}

.material-stats span {
    color: #666;
}

.material-stats strong {
    color: #667eea;
    font-size: 1.2rem;
}

.material-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    max-height: 300px;
    overflow-y: auto;
}

.material-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}

.color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 1px solid #ddd;
}

.color-code {
    font-weight: 600;
    color: #333;
}

.color-name {
    color: #666;
    font-size: 0.9rem;
}

.color-count {
    margin-left: auto;
    font-weight: 600;
    color: #667eea;
}

/* 导出按钮 */
.export-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn-export {
    flex: 1;
    min-width: 150px;
    padding: 12px 25px;
    border: 2px solid #667eea;
    border-radius: 10px;
    background: white;
    color: #667eea;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-export:hover {
    background: #667eea;
    color: white;
}

/* 加载状态 */
.loading {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading p {
    margin-top: 20px;
    font-size: 1.2rem;
    color: #666;
}

/* 页脚 */
footer {
    background: #f8f9fa;
    padding: 20px;
    text-align: center;
    color: #666;
    border-top: 1px solid #eee;
}

/* 响应式 */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }
    
    header h1 {
        font-size: 1.8rem;
    }
    
    main {
        padding: 20px;
    }
    
    .button-group {
        flex-direction: column;
    }
    
    .export-buttons {
        flex-direction: column;
    }
}


/* 滑块样式 */
.slider {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, #667eea, #764ba2);
    outline: none;
    -webkit-appearance: none;
    margin: 10px 0;
}

.slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ff4757;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(255, 71, 87, 0.4);
    transition: transform 0.2s;
}

.slider::-webkit-slider-thumb:hover {
    transform: scale(1.1);
}

.slider::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ff4757;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 10px rgba(255, 71, 87, 0.4);
}

.size-display {
    float: right;
    color: #667eea;
    font-weight: 700;
}

.size-info {
    background: white;
    border: 2px solid #667eea;
    border-radius: 10px;
    padding: 10px 15px;
    text-align: center;
    font-weight: 600;
    color: #667eea;
    margin-bottom: 10px;
}

.preset-label {
    color: #888;
    font-size: 0.9rem;
    margin-right: 5px;
}

#standardHint {
    font-style: italic;
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 拼豆图纸生成器</h1>
            <p class="subtitle">将图片转换为拼豆图纸，支持多种色号标准</p>
        </header>

        <main>
            <!-- 上传区域 -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <p>拖拽图片到此处<br>或点击上传</p>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden>
                </div>
                <div class="preview-container" id="previewContainer" style="display: none;">
                    <img id="previewImage" alt="预览">
                    <button class="btn-remove" id="removeImage">✕</button>
                </div>
                

            </section>

            <!-- 设置区域 -->
            <section class="settings-section">
                <h2>⚙️ 设置</h2>
                
                <div class="setting-group">
                    <label>拼豆板尺寸</label>
                    <div class="size-inputs">
                        <input type="number" id="widthInput" value="80" min="10" max="5000" placeholder="宽">
                        <span>×</span>
                        <input type="number" id="heightInput" value="80" min="10" max="5000" placeholder="高">
                    </div>
                    <div class="preset-sizes">
                        <span class="preset-label">快捷设置:</span>
                        <button class="size-btn" data-size="30x30">30×30</button>
                        <button class="size-btn" data-size="50x50">50×50</button>
                        <button class="size-btn active" data-size="80x80">80×80</button>
                        <button class="size-btn" data-size="100x100">100×100</button>
                        <button class="size-btn" data-size="150x150">150×150</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label>色号标准</label>
                    <select id="standardSelect" class="select-input">
                        <!-- 动态加载 -->
                    </select>
                    <p class="hint" id="standardHint">选择拼豆品牌的色号体系</p>
                </div>

                <div class="setting-group">
                    <label>输出精度</label>
                    <div class="preset-sizes">
                        <button class="precision-btn" data-size="20">标准</button>
                        <button class="precision-btn active" data-size="30">高清</button>
                        <button class="precision-btn" data-size="40">超清</button>
                    </div>
                    <p class="hint">单元格越大，图纸越清晰，但文件也越大</p>
                </div>

                <div class="setting-group">
                    <label>颜色精简 <span class="size-display" id="simplifyValue">自动</span></label>
                    <input type="range" class="slider" id="simplifySlider" min="0" max="100" value="50">
                    <p class="hint" id="simplifyHint">减少跳色，数值越大跳色越少</p>
                </div>

                <div class="setting-group">
                    <label>显示选项</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showGridLines" checked>
                            显示网格线
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showColorCodes" checked>
                            显示色号
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showOutline" checked>
                            显示描边
                        </label>

                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="generateBtn">🎨 生成图纸</button>
                    <button class="btn-secondary" id="resetBtn">🔄 重置</button>
                </div>
            </section>

            <!-- 结果区域 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <h2>📄 生成结果</h2>
                
                <div class="result-preview">
                    <div class="preview-box">
                        <h3>原图</h3>
                        <canvas id="originalCanvas"></canvas>
                    </div>
                    <div class="preview-box">
                        <h3>图纸预览</h3>
                        <canvas id="patternCanvas"></canvas>
                    </div>
                </div>

                <!-- 材料清单 -->
                <div class="material-list" id="materialList">
                    <h3>📋 材料清单</h3>
                    <div class="material-stats">
                        <span>总珠数: <strong id="totalBeads">0</strong> 颗</span>
                        <span>颜色数: <strong id="colorCount">0</strong> 种</span>
                    </div>
                    <div class="material-items" id="materialItems">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <!-- 导出按钮 -->
                <div class="export-buttons">
                    <button class="btn-export" id="downloadPng">📥 下载像素图</button>
                    <button class="btn-export" id="downloadPattern">📄 下载图纸</button>
                    <button class="btn-export" id="copyMaterial">📋 复制清单</button>
                </div>
            </section>

            <!-- 加载状态 -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在生成图纸...</p>
            </div>
        </main>

        <footer>
            <p>支持色号标准：MARD | Perler | Hama | Artkal | Nabbi | IKEA</p>
        </footer>
    </div>

let currentImage = null;

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', async () => {

});

// 加载色号标准注册表
async function loadStandardsRegistry() {
    try {
        standardsRegistry = { standards: Object.entries(colorLibraries).map(([id, lib]) => ({ id, name: lib.name, brand: lib.brand, total_colors: lib.totalColors })) };

// 渲染色号标准选择器
function renderStandardSelect() {
    const select = document.getElementById('standardSelect');
    select.innerHTML = '';
    
    // 直接列出所有颜色库，按颜色数量排序（多的在前）
    const sortedStandards = [...standardsRegistry.standards].sort((a, b) => 
        (b.total_colors || 0) - (a.total_colors || 0)
    );
    
    sortedStandards.forEach(standard => {
        const option = document.createElement('option');
        option.value = standard.id;
        const colorCount = standard.total_colors || standard.colorCount || 0;
        const brand = standard.brand || '';
        option.textContent = `${standard.name} (${colorCount}色)`;
        select.appendChild(option);
    });
    
    // 更新提示文字
    updateStandardHint();
    select.addEventListener('change', updateStandardHint);
}

// 更新色号标准提示
function updateStandardHint() {
    const select = document.getElementById('standardSelect');
    const hint = document.getElementById('standardHint');
    const selectedId = select.value;
    const standard = standardsRegistry.standards.find(s => s.id === selectedId);
    
    if (standard) {
        hint.textContent = standard.description || `${standard.brand || ''}拼豆色号体系`;
    }
}

function initEventListeners() {
    // 上传区域
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', handleDragOver);

    uploadArea.addEventListener('drop', handleDrop);
    fileInput.addEventListener('change', handleFileSelect);

    document.getElementById('removeImage').addEventListener('click', removeImage);
    
    // 快捷尺寸按钮
    document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const [w, h] = btn.dataset.size.split('x').map(Number);
            document.getElementById('widthInput').value = w;
            document.getElementById('heightInput').value = h;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // 自动更新精简值
            updateAutoSimplify(w, h);
        });
    });
    
    // 尺寸输入框变化时更新快捷按钮状态
    const updateSizeButtons = () => {
        const w = parseInt(document.getElementById('widthInput').value);
        const h = parseInt(document.getElementById('heightInput').value);
        document.querySelectorAll('.size-btn').forEach(btn => {
            const [bw, bh] = btn.dataset.size.split('x').map(Number);
            if (bw === w && bh === h) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        // 自动更新精简值
        updateAutoSimplify(w, h);
    };
    document.getElementById('widthInput').addEventListener('input', updateSizeButtons);
    document.getElementById('heightInput').addEventListener('input', updateSizeButtons);
    
    // 精度预设
    document.querySelectorAll('.precision-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedCellSize = parseInt(btn.dataset.size);
            document.querySelectorAll('.precision-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    
    // 颜色精简滑块
    const simplifySlider = document.getElementById('simplifySlider');
    const simplifyValue = document.getElementById('simplifyValue');
    const simplifyHint = document.getElementById('simplifyHint');
    let lastAutoSimplify = 50;
    
    function updateSimplifyDisplay(autoValue) {
        const val = parseInt(simplifySlider.value);
        const diff = val - autoValue;
        
        let levelText;
        if (val < 20) {
            levelText = '极低';
        } else if (val < 40) {
            levelText = '较低';
        } else if (val < 60) {
            levelText = '中等';
        } else if (val < 80) {
            levelText = '较高';
        } else {
            levelText = '极高';
        }
        
        if (diff === 0) {
            simplifyValue.textContent = `自动 (${levelText})`;
            simplifyHint.textContent = '自动根据尺寸调节，拖动可手动微调';
        } else if (diff > 0) {
            simplifyValue.textContent = `${levelText} (+${diff})`;
            simplifyHint.textContent = `自动值${autoValue}，手动增加了${diff}`;
        } else {
            simplifyValue.textContent = `${levelText} (${diff})`;
            simplifyHint.textContent = `自动值${autoValue}，手动减少了${Math.abs(diff)}`;
        }
    }
    
    function updateAutoSimplify(w, h) {
        lastAutoSimplify = getAutoSimplifyLevel(w, h);
        simplifySlider.value = lastAutoSimplify;
        updateSimplifyDisplay(lastAutoSimplify);
    }
    
    let simplifyDebounceTimer = null;
    simplifySlider.addEventListener('input', () => {
        updateSimplifyDisplay(lastAutoSimplify);
        // 防抖：如果已经生成了图纸，延迟300ms后自动更新
        if (currentImage && document.getElementById('resultSection').style.display !== 'none') {
            clearTimeout(simplifyDebounceTimer);
            simplifyDebounceTimer = setTimeout(() => {
                generatePattern();
            }, 300);
        }
    });
    
    // 初始化精简值
    updateAutoSimplify(80, 80);
    
    // 生成按钮
    document.getElementById('generateBtn').addEventListener('click', generatePattern);
    
    // 重置按钮
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    
    // 导出按钮
    document.getElementById('downloadPng').addEventListener('click', downloadPng);
    document.getElementById('downloadPattern').addEventListener('click', downloadPattern);
    document.getElementById('copyMaterial').addEventListener('click', copyMaterialList);
}

// 拖拽处理
function handleDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('dragover');
}

function handleDragLeave(e) {
    e.currentTarget.classList.remove('dragover');
}

function handleDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        handleFiles(files);
    }
}

function handleFileSelect(e) {
    const files = e.target.files;
    if (files.length > 0) {
        handleFiles(files);
    }
}

function handleFiles(files) {
    const file = files[0];
    if (!file.type.startsWith('image/')) {
        alert('请上传图片文件');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
        currentImage = new Image();
        currentImage.onload = () => {
            showPreview(e.target.result);
        };
        currentImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function showPreview(src) {
    document.getElementById('uploadArea').style.display = 'none';
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('previewImage').src = src;
}

function removeImage() {
    currentImage = null;
    document.getElementById('uploadArea').style.display = 'block';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('recommendSection').style.display = 'none';
    document.getElementById('fileInput').value = '';
    document.getElementById('resultSection').style.display = 'none';
}

function resetAll() {
    removeImage();
    document.getElementById('widthInput').value = 80;
    document.getElementById('heightInput').value = 80;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
}

// ==================== 核心算法 ====================

// RGB → XYZ 转换
function rgbToXyz(r, g, b) {
    r = r / 255;
    g = g / 255;
    b = b / 255;
    
    r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
    g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
    b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
    
    const x = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) * 100;
    const y = (r * 0.2126729 + g * 0.7151522 + b * 0.0721750) * 100;
    const z = (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) * 100;
    
    return { x, y, z };
}

// XYZ → Lab 转换
function xyzToLab(x, y, z) {
    const xn = 95.047, yn = 100.000, zn = 108.883;
    
    const fx = f(x / xn);
    const fy = f(y / yn);
    const fz = f(z / zn);
    
    const L = 116 * fy - 16;
    const a = 500 * (fx - fy);
    const b = 200 * (fy - fz);
    
    return { L, a, b };
}

function f(t) {
    const delta = 6 / 29;
    return t > delta ? Math.pow(t, 1/3) : t / (3 * delta * delta) + 4 / 29;
}

// RGB → Lab 一键转换
function rgbToLab(r, g, b) {
    const xyz = rgbToXyz(r, g, b);
    return xyzToLab(xyz.x, xyz.y, xyz.z);
}

// 计算 ΔE (CIE76)
function deltaE(lab1, lab2) {
    return Math.sqrt(
        Math.pow(lab1.L - lab2.L, 2) +
        Math.pow(lab1.a - lab2.a, 2) +
        Math.pow(lab1.b - lab2.b, 2)
    );
}

// 预计算颜色的 Lab 值（兼容数组和对象格式）
function precomputeLab(palette) {
    return palette.map(color => {
        // 兼容 rgb 数组格式 [r,g,b] 和对象格式 {r,g,b}
        const r = Array.isArray(color.rgb) ? color.rgb[0] : color.rgb.r;
        const g = Array.isArray(color.rgb) ? color.rgb[1] : color.rgb.g;
        const b = Array.isArray(color.rgb) ? color.rgb[2] : color.rgb.b;
        
        // 如果已有预计算的 Lab 值，直接使用
        if (color.lab) {
            const labL = Array.isArray(color.lab) ? color.lab[0] : (color.lab.L !== undefined ? color.lab.L : color.lab.l);
            const labA = Array.isArray(color.lab) ? color.lab[1] : color.lab.a;
            const labB = Array.isArray(color.lab) ? color.lab[2] : color.lab.b;
            return {
                ...color,
                rgb: { r, g, b },
                lab: { L: labL, a: labA, b: labB }
            };
        }
        
        return {
            ...color,
            rgb: { r, g, b },
            lab: rgbToLab(r, g, b)
        };
    });
}

// 找到最匹配的拼豆颜色（使用LAB颜色空间，更准确）
function findClosestColor(r, g, b, paletteWithLab) {
    const brightness = (r + g + b) / 3;
    
    // 白色检测：纯白留空
    if (brightness > 250) {
        return null;
    }
    
    // 将RGB转换为LAB
    const inputLab = rgbToLab(r, g, b);
    
    // 使用LAB距离匹配（更符合人眼感知）
    let minDistance = Infinity;
    let closestColor = paletteWithLab[0];
    
    for (const bead of paletteWithLab) {
        // 读取LAB值（兼容数组和对象格式）
        let beadL, beadA, beadB;
        if (bead.lab) {
            if (Array.isArray(bead.lab)) {
                beadL = bead.lab[0];
                beadA = bead.lab[1];
                beadB = bead.lab[2];
            } else {
                beadL = bead.lab.L !== undefined ? bead.lab.L : bead.lab.l;
                beadA = bead.lab.a;
                beadB = bead.lab.b !== undefined ? bead.lab.b : bead.lab.B;
            }
        } else {
            // 如果没有LAB值，临时计算
            const lab = rgbToLab(bead.rgb.r, bead.rgb.g, bead.rgb.b);
            beadL = lab[0];
            beadA = lab[1];
            beadB = lab[2];
        }
        
        // LAB Delta E 距离
        const dL = inputLab[0] - beadL;
        const da = inputLab[1] - beadA;
        const db = inputLab[2] - beadB;
        const distance = dL*dL + da*da + db*db;
        
        if (distance < minDistance) {
            minDistance = distance;
            closestColor = bead;
        }
    }
    
    return closestColor;
}

// RGB转LAB
function rgbToLab(r, g, b) {
    // RGB to XYZ
    let rn = r / 255;
    let gn = g / 255;
    let bn = b / 255;
    
    rn = rn > 0.04045 ? Math.pow((rn + 0.055) / 1.055, 2.4) : rn / 12.92;
    gn = gn > 0.04045 ? Math.pow((gn + 0.055) / 1.055, 2.4) : gn / 12.92;
    bn = bn > 0.04045 ? Math.pow((bn + 0.055) / 1.055, 2.4) : bn / 12.92;
    
    const x = (rn * 0.4124 + gn * 0.3576 + bn * 0.1805) / 0.95047;
    const y = (rn * 0.2126 + gn * 0.7152 + bn * 0.0722) / 1.00000;
    const z = (rn * 0.0193 + gn * 0.1192 + bn * 0.9505) / 1.08883;
    
    // XYZ to LAB
    const fx = x > 0.008856 ? Math.pow(x, 1/3) : (7.787 * x) + 16/116;
    const fy = y > 0.008856 ? Math.pow(y, 1/3) : (7.787 * y) + 16/116;
    const fz = z > 0.008856 ? Math.pow(z, 1/3) : (7.787 * z) + 16/116;
    
    const L = (116 * fy) - 16;
    const a = 500 * (fx - fy);
    const bLab = 200 * (fy - fz);
    
    return [L, a, bLab];
}

// ==================== 图像处理 ====================

// 简单可靠的像素化 - 区域平均采样（增强版）
function pixelateImage(image, targetWidth, targetHeight) {
    const canvas = document.createElement('canvas');
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, targetWidth, targetHeight);
    
    // 计算图片位置
    const imgRatio = image.width / image.height;
    const targetRatio = targetWidth / targetHeight;
    let drawWidth, drawHeight, offsetX, offsetY;
    
    if (imgRatio > targetRatio) {
        drawWidth = targetWidth;
        drawHeight = Math.round(targetWidth / imgRatio);
        offsetX = 0;
        offsetY = Math.round((targetHeight - drawHeight) / 2);
    } else {
        drawHeight = targetHeight;
        drawWidth = Math.round(targetHeight * imgRatio);
        offsetX = Math.round((targetWidth - drawWidth) / 2);
        offsetY = 0;
    }
    
    // 创建高分辨率采样图 - 增加到8倍采样
    const scale = 8;
    const sampleWidth = drawWidth * scale;
    const sampleHeight = drawHeight * scale;
    
    const sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = sampleWidth;
    sampleCanvas.height = sampleHeight;
    const sampleCtx = sampleCanvas.getContext('2d');
    
    // 启用高质量平滑
    sampleCtx.imageSmoothingEnabled = true;
    sampleCtx.imageSmoothingQuality = 'high';
    sampleCtx.drawImage(image, 0, 0, sampleWidth, sampleHeight);
    
    const sampleData = sampleCtx.getImageData(0, 0, sampleWidth, sampleHeight);
    
    // 生成像素图 - 每个目标像素取采样区域的平均颜色
    const resultData = ctx.createImageData(targetWidth, targetHeight);
    const resultPixels = resultData.data;
    
    for (let y = 0; y < targetHeight; y++) {
        for (let x = 0; x < targetWidth; x++) {
            const resultIdx = (y * targetWidth + x) * 4;
            
            if (x >= offsetX && x < offsetX + drawWidth && 
                y >= offsetY && y < offsetY + drawHeight) {
                
                const localX = x - offsetX;
                const localY = y - offsetY;
                
                // 计算采样区域的平均颜色 - 使用更多采样点
                let r = 0, g = 0, b = 0, count = 0;
                
                // 中心加权采样 - 中心权重更高
                const centerWeight = 2;
                
                for (let dy = 0; dy < scale; dy++) {
                    for (let dx = 0; dx < scale; dx++) {
                        const idx = ((localY * scale + dy) * sampleWidth + (localX * scale + dx)) * 4;
                        
                        // 计算权重 - 离中心越近权重越高
                        const cx = (dx - scale/2 + 0.5) / (scale/2);
                        const cy = (dy - scale/2 + 0.5) / (scale/2);
                        const dist = Math.sqrt(cx*cx + cy*cy);
                        const weight = dist < 0.5 ? centerWeight : 1;
                        
                        r += sampleData.data[idx] * weight;
                        g += sampleData.data[idx + 1] * weight;
                        b += sampleData.data[idx + 2] * weight;
                        count += weight;
                    }
                }
                
                resultPixels[resultIdx] = Math.round(r / count);
                resultPixels[resultIdx + 1] = Math.round(g / count);
                resultPixels[resultIdx + 2] = Math.round(b / count);
                resultPixels[resultIdx + 3] = 255;
            } else {
                // 白色背景
                resultPixels[resultIdx] = 255;
                resultPixels[resultIdx + 1] = 255;
                resultPixels[resultIdx + 2] = 255;
                resultPixels[resultIdx + 3] = 255;
            }
        }
    }
    
    ctx.putImageData(resultData, 0, 0);
    return ctx.getImageData(0, 0, targetWidth, targetHeight);
}

// Floyd-Steinberg 抖动处理
function processPixelsWithDithering(imageData, paletteWithLab) {
    const width = imageData.width;
    const height = imageData.height;
    
    // 复制像素数据（Float数组用于误差累积）
    const pixels = new Float32Array(width * height * 4);
    for (let i = 0; i < imageData.data.length; i++) {
        pixels[i] = imageData.data[i];
    }
    
    const colorMap = new Array(width * height);
    const colorCount = {};
    
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            let r = Math.round(pixels[idx]);
            let g = Math.round(pixels[idx + 1]);
            let b = Math.round(pixels[idx + 2]);
            const a = pixels[idx + 3];
            
            // 跳过透明像素
            if (a < 128) {
                colorMap[y * width + x] = null;
                continue;
            }
            
            // 限制范围
            r = Math.max(0, Math.min(255, r));
            g = Math.max(0, Math.min(255, g));
            b = Math.max(0, Math.min(255, b));
            
            const matched = findClosestColor(r, g, b, paletteWithLab);
            colorMap[y * width + x] = matched;
            
            if (matched) {
                colorCount[matched.code] = (colorCount[matched.code] || 0) + 1;
                
                // 计算误差
                const errR = r - matched.rgb.r;
                const errG = g - matched.rgb.g;
                const errB = b - matched.rgb.b;
                
                // 扩散误差到周围像素
                // 右边像素: 7/16
                if (x + 1 < width) {
                    const i = idx + 4;
                    pixels[i] += errR * 7 / 16;
                    pixels[i + 1] += errG * 7 / 16;
                    pixels[i + 2] += errB * 7 / 16;
                }
                // 左下像素: 3/16
                if (y + 1 < height && x > 0) {
                    const i = ((y + 1) * width + x - 1) * 4;
                    pixels[i] += errR * 3 / 16;
                    pixels[i + 1] += errG * 3 / 16;
                    pixels[i + 2] += errB * 3 / 16;
                }
                // 下方像素: 5/16
                if (y + 1 < height) {
                    const i = ((y + 1) * width + x) * 4;
                    pixels[i] += errR * 5 / 16;
                    pixels[i + 1] += errG * 5 / 16;
                    pixels[i + 2] += errB * 5 / 16;
                }
                // 右下像素: 1/16
                if (y + 1 < height && x + 1 < width) {
                    const i = ((y + 1) * width + x + 1) * 4;
                    pixels[i] += errR * 1 / 16;
                    pixels[i + 1] += errG * 1 / 16;
                    pixels[i + 2] += errB * 1 / 16;
                }
            }
        }
    }
    
    return { colorMap, colorCount, width, height };
}

// 处理像素数据，匹配颜色（无抖动）
function processPixels(imageData, paletteWithLab) {
    const width = imageData.width;
    const height = imageData.height;
    const colorMap = new Array(width * height);
    const colorCount = {};
    
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            const r = imageData.data[idx];
            const g = imageData.data[idx + 1];
            const b = imageData.data[idx + 2];
            const a = imageData.data[idx + 3];
            
            // 跳过透明像素
            if (a < 128) {
                colorMap[y * width + x] = null;
                continue;
            }
            
            const matched = findClosestColor(r, g, b, paletteWithLab);
            colorMap[y * width + x] = matched;
            
            // 统计
            if (matched) {
                colorCount[matched.code] = (colorCount[matched.code] || 0) + 1;
            }
        }
    }
    
    return { colorMap, colorCount, width, height };
}

// 颜色精简：减少跳色，合并孤立像素
function simplifyColors(colorMap, colorCount, paletteWithLab, simplifyLevel, width, height) {
    if (simplifyLevel === 0) {
        return { colorMap, colorCount };
    }
    
    let currentColorMap = [...colorMap];
    let currentColorCount = { ...colorCount };
    
    // 第一步：跳色减少（相邻颜色合并）
    // 条件：主流邻居颜色>=4次，且当前颜色与主流颜色RGB距离<80
    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const idx = y * width + x;
            const current = currentColorMap[idx];
            if (!current) continue;
            
            // 检查周围8格
            const neighbors = [
                currentColorMap[(y-1)*width + x-1], currentColorMap[(y-1)*width + x], currentColorMap[(y-1)*width + x+1],
                currentColorMap[y*width + x-1], currentColorMap[y*width + x+1],
                currentColorMap[(y+1)*width + x-1], currentColorMap[(y+1)*width + x], currentColorMap[(y+1)*width + x+1]
            ].filter(c => c);
            
            if (neighbors.length === 0) continue;
            
            // 统计邻居颜色
            const neighborCount = {};
            neighbors.forEach(c => {
                const code = c.code || c.id;
                neighborCount[code] = (neighborCount[code] || 0) + 1;
            });
            
            // 找最多的邻居颜色
            const sorted = Object.entries(neighborCount).sort((a, b) => b[1] - a[1]);
            const dominant = sorted[0];
            const currentCode = current.code || current.id;
            
            // 如果当前颜色只出现1次且主流邻居颜色>=4次，且颜色接近，则合并
            if (dominant && dominant[1] >= 4 && currentCode !== dominant[0]) {
                const dominantColor = paletteWithLab.find(c => (c.code || c.id) === dominant[0]);
                if (dominantColor) {
                    // 计算RGB距离
                    const dr = current.rgb.r - dominantColor.rgb.r;
                    const dg = current.rgb.g - dominantColor.rgb.g;
                    const db = current.rgb.b - dominantColor.rgb.b;
                    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
                    
                    // 根据精简程度调整距离阈值（精简程度越高，阈值越大，合并越多）
                    const distThreshold = 50 + simplifyLevel * 0.5; // 50-100
                    
                    if (dist < distThreshold) {
                        currentColorMap[idx] = dominantColor;
                        currentColorCount[currentCode] = (currentColorCount[currentCode] || 0) - 1;
                        currentColorCount[dominant[0]] = (currentColorCount[dominant[0]] || 0) + 1;
                    }
                }
            }
        }
    }
    
    // 第二步：迭代处理孤立点（根据精简程度）
    const neighborThreshold = Math.max(1, 3 - Math.floor(simplifyLevel / 40));
    const dominantThreshold = Math.max(2, 5 - Math.floor(simplifyLevel / 30));
    const iterations = Math.min(4, Math.ceil(simplifyLevel / 25) + 1);
    
    for (let iter = 0; iter < iterations; iter++) {
        let changed = 0;
        
        for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
                const idx = y * width + x;
                const currentColor = currentColorMap[idx];
                if (!currentColor) continue;
                
                const currentCode = currentColor.code || currentColor.id;
                
                // 获取8邻域
                const neighbors = [];
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dy === 0 && dx === 0) continue;
                        const ny = y + dy;
                        const nx = x + dx;
                        if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                            neighbors.push(currentColorMap[ny * width + nx]);
                        }
                    }
                }
                
                // 统计邻居颜色
                const neighborCount = {};
                for (const n of neighbors) {
                    if (n) {
                        const code = n.code || n.id;
                        neighborCount[code] = (neighborCount[code] || 0) + 1;
                    }
                }
                
                // 当前颜色在邻居中的数量
                const currentInNeighbors = neighborCount[currentCode] || 0;
                
                // 找主流颜色
                let maxCount = 0;
                let dominantCode = currentCode;
                for (const [code, count] of Object.entries(neighborCount)) {
                    if (count > maxCount) {
                        maxCount = count;
                        dominantCode = code;
                    }
                }
                
                // 孤立点合并
                if (currentInNeighbors <= neighborThreshold && maxCount >= dominantThreshold) {
                    const newColor = paletteWithLab.find(c => (c.code || c.id) === dominantCode);
                    if (newColor && dominantCode !== currentCode) {
                        currentColorMap[idx] = newColor;
                        currentColorCount[currentCode] = (currentColorCount[currentCode] || 0) - 1;
                        currentColorCount[dominantCode] = (currentColorCount[dominantCode] || 0) + 1;
                        changed++;
                    }
                }
            }
        }
        
        if (changed < 3) break;
    }
    
    // 清理计数为0的颜色
    for (const code of Object.keys(currentColorCount)) {
        if (currentColorCount[code] <= 0) {
            delete currentColorCount[code];
        }
    }
    
    return { colorMap: currentColorMap, colorCount: currentColorCount };
}

// 根据尺寸计算推荐的精简程度
function getAutoSimplifyLevel(width, height) {
    const totalPixels = width * height;
    if (totalPixels <= 900) return 60;
    if (totalPixels <= 2500) return 50;
    if (totalPixels <= 5000) return 40;
    return 30;
}

// 获取某个颜色周围相邻的颜色
function getAdjacentColors(colorMap, targetCode, width, height, paletteWithLab) {
    const adjacentColors = new Set();
    const codeToCheck = targetCode;
    
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = y * width + x;
            const color = colorMap[idx];
            if (color && (color.code || color.id) === codeToCheck) {
                // 检查上下左右
                const neighbors = [
                    [y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]
                ];
                for (const [ny, nx] of neighbors) {
                    if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                        const neighborColor = colorMap[ny * width + nx];
                        if (neighborColor && (neighborColor.code || neighborColor.id) !== codeToCheck) {
                            adjacentColors.add(neighborColor.code || neighborColor.id);
                        }
                    }
                }
            }
        }
    }
    
    return adjacentColors;
}

// 计算两个颜色的RGB距离平方
function colorDistance(rgb1, rgb2) {
    const dr = rgb1.r - rgb2.r;
    const dg = rgb1.g - rgb2.g;
    const db = rgb1.b - rgb2.b;
    return dr * dr + dg * dg + db * db;
}

// ==================== 图纸生成 ====================

// 生成网格图纸
function generatePatternGrid(colorMap, width, height, options = {}) {
    const { 
        cellSize = 20,
        showGridLines = true,
        showColorCodes = true,
        showOutline = true
    } = options;
    
    // 边距用于标注坐标数字
    const margin = 30;
    const canvas = document.createElement('canvas');
    canvas.width = width * cellSize + margin;
    canvas.height = height * cellSize + margin;
    const ctx = canvas.getContext('2d');
    
    // 白色背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 绘制坐标数字（每10格标注一次，与粗线分界对应）
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // 顶部横坐标（列号）
    for (let x = 0; x < width; x++) {
        if (x % 10 === 0) {
            const num = x + 1;
            ctx.fillText(num.toString(), margin + x * cellSize + cellSize / 2, margin / 2);
        }
    }
    
    // 左侧纵坐标（行号）
    ctx.textAlign = 'right';
    for (let y = 0; y < height; y++) {
        if (y % 10 === 0) {
            const num = y + 1;
            ctx.fillText(num.toString(), margin - 5, margin + y * cellSize + cellSize / 2);
        }
    }
    
    // 第一步：绘制所有颜色块（不画描边）
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const color = colorMap[y * width + x];
            const px = margin + x * cellSize;
            const py = margin + y * cellSize;
            
            if (!color) {
                // 透明区域 - 白色
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(px, py, cellSize, cellSize);
            } else {
                // 绘制颜色块
                ctx.fillStyle = color.hex;
                ctx.fillRect(px, py, cellSize, cellSize);
            }
        }
    }
    
    // 第二步：统一绘制清晰的黑色描边网格（所有格子都有描边）
    if (showOutline) {
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.setLineDash([]); // 实线，不是虚线
        
        // 画垂直线
        for (let x = 0; x <= width; x++) {
            ctx.beginPath();
            ctx.moveTo(margin + x * cellSize, margin);
            ctx.lineTo(margin + x * cellSize, margin + height * cellSize);
            ctx.stroke();
        }
        
        // 画水平线
        for (let y = 0; y <= height; y++) {
            ctx.beginPath();
            ctx.moveTo(margin, margin + y * cellSize);
            ctx.lineTo(margin + width * cellSize, margin + y * cellSize);
            ctx.stroke();
        }
    }
    
    // 第三步：标注色号
    if (showColorCodes && cellSize >= 15) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const color = colorMap[y * width + x];
                if (!color) continue;
                
                const px = margin + x * cellSize;
                const py = margin + y * cellSize;
                
                ctx.fillStyle = getContrastColor(color.rgb);
                ctx.font = `bold ${Math.max(8, cellSize / 3)}px Arial`;
                ctx.fillText(color.code || color.id, px + cellSize/2, py + cellSize/2);
            }
        }
    }
    
    // 绘制10格分界线（粗线，方便定位）
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    
    // 垂直分界线
    for (let x = 10; x < width; x += 10) {
        ctx.beginPath();
        ctx.moveTo(margin + x * cellSize, margin);
        ctx.lineTo(margin + x * cellSize, margin + height * cellSize);
        ctx.stroke();
    }
    
    // 水平分界线
    for (let y = 10; y < height; y += 10) {
        ctx.beginPath();
        ctx.moveTo(margin, margin + y * cellSize);
        ctx.lineTo(margin + width * cellSize, margin + y * cellSize);
        ctx.stroke();
    }
    
    // 绘制外边框
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.strokeRect(margin, margin, width * cellSize, height * cellSize);
    
    return canvas;
}

// 获取对比文字颜色
function getContrastColor(rgb) {
    const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
    return luminance > 0.5 ? '#000000' : '#ffffff';
}

// ==================== 主流程 ====================

async function generatePattern() {
    if (!currentImage) {
        alert('请先上传图片');
        return;
    }
    
    const generateBtn = document.getElementById('generateBtn');
    generateBtn.disabled = true;
    document.getElementById('loading').style.display = 'flex';
    
    try {
        // 获取设置
        const standardId = document.getElementById('standardSelect').value;
        const targetWidth = parseInt(document.getElementById('widthInput').value) || 80;
        const targetHeight = parseInt(document.getElementById('heightInput').value) || 80;
        
        const showGridLines = document.getElementById('showGridLines').checked;
        const showColorCodes = document.getElementById('showColorCodes').checked;
        const showOutline = document.getElementById('showOutline').checked;
        
        // 加载色号标准
        let palette;
        try {
            palette = colorLibraries[standardId].colors;
        } catch (error) {
            console.error('加载色号标准失败:', error);
            alert('加载色号标准失败，请检查网络连接');
            return;
        }
        
        // 预计算 Lab 值
        const paletteWithLab = precomputeLab(palette);
        
        // 像素化
        const imageData = pixelateImage(currentImage, targetWidth, targetHeight);
        
        // 处理像素（直接匹配，无抖动）
        let { colorMap, colorCount } = processPixels(imageData, paletteWithLab);
        const gridWidth = targetWidth;
        const gridHeight = targetHeight;
        
        // 应用颜色精简
        const simplifyLevel = parseInt(document.getElementById('simplifySlider').value);
        if (simplifyLevel > 0) {
            const result = simplifyColors(colorMap, colorCount, paletteWithLab, simplifyLevel, gridWidth, gridHeight);
            colorMap = result.colorMap;
            colorCount = result.colorCount;
        }
        
        // 边缘处理已禁用
        
        // 显示原图（保持比例居中）
        const originalCanvas = document.getElementById('originalCanvas');
        originalCanvas.width = targetWidth;
        originalCanvas.height = targetHeight;
        const originalCtx = originalCanvas.getContext('2d');
        
        // 白色背景
        originalCtx.fillStyle = '#ffffff';
        originalCtx.fillRect(0, 0, targetWidth, targetHeight);
        
        // 计算居中位置
        const imgRatio = currentImage.width / currentImage.height;
        const targetRatio = targetWidth / targetHeight;
        let drawW, drawH, offX, offY;
        
        if (imgRatio > targetRatio) {
            drawW = targetWidth;
            drawH = Math.round(targetWidth / imgRatio);
            offX = 0;
            offY = Math.round((targetHeight - drawH) / 2);
        } else {
            drawH = targetHeight;
            drawW = Math.round(targetHeight * imgRatio);
            offX = Math.round((targetWidth - drawW) / 2);
            offY = 0;
        }
        
        originalCtx.imageSmoothingEnabled = false;
        originalCtx.drawImage(currentImage, offX, offY, drawW, drawH);
        
        // 生成图纸
        const patternCanvas = generatePatternGrid(colorMap, targetWidth, targetHeight, {
            cellSize: selectedCellSize,
            showGridLines,
            showColorCodes,
            showOutline
        });
        
        const displayCanvas = document.getElementById('patternCanvas');
        displayCanvas.width = patternCanvas.width;
        displayCanvas.height = patternCanvas.height;
        displayCanvas.getContext('2d').drawImage(patternCanvas, 0, 0);
        
        // 保存用于导出
        displayCanvas._patternCanvas = patternCanvas;
        displayCanvas._colorCount = colorCount;
        displayCanvas._palette = palette;
        
        // 显示材料清单
        renderMaterialList(colorCount, palette);
        
        // 显示结果区域
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        
    } catch (error) {
        console.error('生成失败:', error);
        alert('生成失败: ' + error.message);
    } finally {
        generateBtn.disabled = false;
        document.getElementById('loading').style.display = 'none';
    }
}

// 渲染材料清单
function renderMaterialList(colorCount, palette) {
    const totalBeads = Object.values(colorCount).reduce((a, b) => a + b, 0);
    const colorCountNum = Object.keys(colorCount).length;
    
    document.getElementById('totalBeads').textContent = totalBeads;
    document.getElementById('colorCount').textContent = colorCountNum;
    
    // 排序
    const sorted = Object.entries(colorCount).sort((a, b) => b[1] - a[1]);
    
    const container = document.getElementById('materialItems');
    container.innerHTML = sorted.map(([code, count]) => {
        const color = palette.find(c => (c.code || c.id) === code);
        return `
            <div class="material-item">
                <div class="color-swatch" style="background-color: ${color?.hex || '#fff'}"></div>
                <span class="color-code">${code}</span>
                <span class="color-name">${color?.name || ''}</span>
                <span class="color-count">${count}颗</span>
            </div>
        `;
    }).join('');
}

// 下载图纸（上方像素图 + 下方材料清单）
function downloadPattern() {
    const patternCanvas = document.getElementById('patternCanvas')._patternCanvas;
    if (!patternCanvas) {
        alert('请先生成图纸');
        return;
    }
    
    const colorCount = document.getElementById('patternCanvas')._colorCount;
    const palette = document.getElementById('patternCanvas')._palette;
    
    // 创建新画布
    const padding = 20;
    const patternWidth = patternCanvas.width;
    const patternHeight = patternCanvas.height;
    
    // 材料清单区域 - 按照参考图格式
    const sorted = Object.entries(colorCount).sort((a, b) => b[1] - a[1]);
    const colorBoxSize = 60; // 颜色块大小
    const colorBoxGap = 8;   // 间距
    const colorsPerRow = Math.floor((patternWidth - padding * 2 + colorBoxGap) / (colorBoxSize + colorBoxGap));
    const rowCount = Math.ceil(sorted.length / colorsPerRow);
    const legendHeight = rowCount * (colorBoxSize + colorBoxGap) + padding * 2 + 10;
    
    const totalWidth = patternWidth;
    const totalHeight = patternHeight + legendHeight;
    
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = totalWidth;
    finalCanvas.height = totalHeight;
    const ctx = finalCanvas.getContext('2d');
    
    // 白色背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, totalWidth, totalHeight);
    
    // 绘制像素图
    ctx.drawImage(patternCanvas, 0, 0);
    
    // 绘制颜色块（紧凑排列）
    sorted.forEach(([code, count], index) => {
        const color = palette.find(c => (c.code || c.id) === code);
        if (!color) return;
        
        const row = Math.floor(index / colorsPerRow);
        const col = index % colorsPerRow;
        const x = padding + col * (colorBoxSize + colorBoxGap);
        const y = patternHeight + padding + row * (colorBoxSize + colorBoxGap);
        
        // 颜色块
        ctx.fillStyle = color.hex;
        ctx.fillRect(x, y, colorBoxSize, colorBoxSize);
        
        // 边框
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, colorBoxSize, colorBoxSize);
        
        // 色号（居中显示）
        ctx.fillStyle = getContrastColor(color.rgb);
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(code, x + colorBoxSize/2, y + colorBoxSize/2);
    });
    
    // 下载
    const link = document.createElement('a');
    link.download = `拼豆图纸_${new Date().toISOString().slice(0, 10)}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
}

function copyMaterialList() {
    const canvas = document.getElementById('patternCanvas');
    if (!canvas._colorCount) {
        alert('请先生成图纸');
        return;
    }
    
    const colorCount = canvas._colorCount;
    const palette = canvas._palette;
    
    let text = '拼豆材料清单\n';
    text += '================\n\n';
    
    const total = Object.values(colorCount).reduce((a, b) => a + b, 0);
    text += `总珠数: ${total} 颗\n`;
    text += `颜色数: ${Object.keys(colorCount).length} 种\n\n`;
    
    const sorted = Object.entries(colorCount).sort((a, b) => b[1] - a[1]);
    
    sorted.forEach(([code, count]) => {
        const color = palette.find(c => (c.code || c.id) === code);
        text += `${code}\t${color?.name || ''}\t${count}颗\n`;
    });
    
    navigator.clipboard.writeText(text).then(() => {
        alert('材料清单已复制到剪贴板');
    }).catch(err => {
        console.error('复制失败:', err);
        // 备用方案
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('材料清单已复制到剪贴板');
    });
}

    </script>
