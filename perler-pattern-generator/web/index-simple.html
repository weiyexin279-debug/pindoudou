<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图纸生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 25px;
            text-align: center;
            color: white;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        main { padding: 25px; }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: #667eea; background: #f0f0ff; }
        .upload-area.has-image { padding: 15px; }
        .upload-area input { display: none; }
        .upload-area .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .preview-img { max-width: 100%; max-height: 250px; border-radius: 8px; }
        
        .settings {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-row label { font-weight: 600; min-width: 90px; }
        .setting-row select, .setting-row input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .setting-row input[type="number"] { width: 70px; text-align: center; }
        .setting-row select { flex: 1; max-width: 250px; }
        
        .slider-row {
            align-items: center;
        }
        .slider-row input[type="range"] {
            flex: 1;
            max-width: 200px;
            height: 8px;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 4px;
            outline: none;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-value {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
        }
        
        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #eee; color: #333; }
        .btn-secondary:hover { background: #ddd; }
        
        .result { display: none; margin-top: 25px; }
        .result.show { display: block; }
        .result h2 { margin-bottom: 15px; font-size: 1.3rem; }
        
        .canvas-container {
            overflow: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: white;
            max-height: 70vh;
        }
        #patternCanvas { display: block; }
        
        .material-list {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .material-list h3 { margin-bottom: 12px; }
        .material-stats { margin-bottom: 12px; }
        .material-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .material-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            background: white;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }
        
        .export-btns { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; }
        
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loading.show { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading p { margin-top: 15px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 拼豆图纸生成器</h1>
            <p>上传图片 → 自动匹配颜色 → 生成带色号图纸</p>
        </header>
        
        <main>
            <div class="upload-area" id="uploadArea">
                <div class="icon">📷</div>
                <p>点击或拖拽上传图片</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="settings">
                <div class="setting-row">
                    <label>色号标准</label>
                    <select id="brandSelect"></select>
                </div>
                <div class="setting-row">
                    <label>图纸尺寸</label>
                    <input type="number" id="widthInput" value="50" min="10" max="200">
                    <span>×</span>
                    <input type="number" id="heightInput" value="50" min="10" max="200">
                    <span style="color:#888">格</span>
                </div>
                <div class="setting-row slider-row">
                    <label>颜色精简</label>
                    <input type="range" id="simplifySlider" min="0" max="100" value="50">
                    <span class="slider-value" id="simplifyValue">50%</span>
                    <span style="color:#888; font-size: 0.85rem;">(数值越高颜色越少)</span>
                </div>
                <div class="setting-row">
                    <label>单元格</label>
                    <select id="cellSizeSelect">
                        <option value="20">标准 20px</option>
                        <option value="25">较大 25px</option>
                        <option value="30" selected>高清 30px</option>
                        <option value="40">超清 40px</option>
                    </select>
                </div>
            </div>
            
            <button class="btn btn-primary" id="generateBtn" disabled>🎨 生成图纸</button>
            
            <div class="result" id="result">
                <h2>📄 生成结果</h2>
                <div class="canvas-container">
                    <canvas id="patternCanvas"></canvas>
                </div>
                
                <div class="material-list">
                    <h3>📋 材料清单</h3>
                    <div class="material-stats">
                        总珠数: <strong id="totalBeads">0</strong> 颗
                        <span style="margin-left:20px">颜色数: <strong id="colorCount">0</strong> 种</span>
                    </div>
                    <div class="material-items" id="materialItems"></div>
                </div>
                
                <div class="export-btns">
                    <button class="btn btn-secondary" id="downloadBtn">📥 下载图纸</button>
                    <button class="btn btn-secondary" id="copyBtn">📋 复制清单</button>
                </div>
            </div>
        </main>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在生成图纸...</p>
    </div>

    {code:'H106', hex:'#CCC5ED'}, {code:'H107', hex:'#6A87C1'}
];

// 颜色库
const PALETTES = {
    'Mard': { name: 'Mard 标准', colors: MARD_COLORS },
    'Perler': { name: 'Perler', colors: PERLER_COLORS },
    'Hama': { name: 'Hama', colors: HAMA_COLORS }
};

// ============ 全局变量 ============
let currentImage = null;
let currentPalette = MARD_COLORS;

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
    initBrandSelect();
    initUpload();
    initButtons();
    initSlider();
});

function initBrandSelect() {
    const select = document.getElementById('brandSelect');
    for (const [id, brand] of Object.entries(PALETTES)) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${brand.name} (${brand.colors.length}色)`;
        select.appendChild(opt);
    }
    select.onchange = () => currentPalette = PALETTES[select.value].colors;
}

function initSlider() {
    const slider = document.getElementById('simplifySlider');
    const value = document.getElementById('simplifyValue');
    slider.oninput = () => {
        value.textContent = slider.value + '%';
    };
}

function initUpload() {
    const area = document.getElementById('uploadArea');
    const input = document.getElementById('fileInput');
    
    area.onclick = () => input.click();
    area.ondragover = e => { e.preventDefault(); area.style.borderColor = '#667eea'; };
    area.ondragleave = () => area.style.borderColor = '#ddd';
    area.ondrop = e => {
        e.preventDefault();
        area.style.borderColor = '#ddd';
        if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
    };
    input.onchange = e => e.target.files[0] && loadImage(e.target.files[0]);
}

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            currentImage = img;
            const area = document.getElementById('uploadArea');
            area.className = 'upload-area has-image';
            area.innerHTML = `<img src="${e.target.result}" class="preview-img"><input type="file" id="fileInput" accept="image/*" style="display:none">`;
            document.getElementById('generateBtn').disabled = false;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function initButtons() {
    document.getElementById('generateBtn').onclick = generate;
    document.getElementById('downloadBtn').onclick = download;
    document.getElementById('copyBtn').onclick = copyList;
}

// ============ 核心算法 ============

// 解析颜色为RGB
function parseColor(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.substr(0,2), 16), parseInt(h.substr(2,2), 16), parseInt(h.substr(4,2), 16)];
}

// 初始化颜色库RGB值
function initPaletteRGB(palette) {
    palette.forEach(c => {
        if (!c.rgb) c.rgb = parseColor(c.hex);
    });
}

// 计算颜色距离
function colorDistance(c1, c2) {
    return Math.sqrt(
        (c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2
    );
}

// 像素化
function pixelate(img, w, h) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    
    const ratio = img.width / img.height;
    const targetRatio = w / h;
    let dw, dh, ox, oy;
    if (ratio > targetRatio) {
        dw = w;
        dh = Math.round(w / ratio);
        ox = 0;
        oy = Math.round((h - dh) / 2);
    } else {
        dh = h;
        dw = Math.round(h * ratio);
        ox = Math.round((w - dw) / 2);
        oy = 0;
    }
    
    ctx.drawImage(img, ox, oy, dw, dh);
    return ctx.getImageData(0, 0, w, h);
}

// 颜色精简：合并相近颜色
function simplifyPalette(palette, threshold) {
    if (threshold <= 0) return palette;
    
    const groups = [];
    const used = new Set();
    
    // 对颜色按亮度排序
    const sorted = [...palette].sort((a, b) => {
        const la = a.rgb[0] * 0.299 + a.rgb[1] * 0.587 + a.rgb[2] * 0.114;
        const lb = b.rgb[0] * 0.299 + b.rgb[1] * 0.587 + b.rgb[2] * 0.114;
        return la - lb;
    });
    
    // 分组相近颜色
    for (const color of sorted) {
        if (used.has(color.code)) continue;
        
        const group = [color];
        used.add(color.code);
        
        for (const other of sorted) {
            if (used.has(other.code)) continue;
            if (colorDistance(color.rgb, other.rgb) < threshold) {
                group.push(other);
                used.add(other.code);
            }
        }
        groups.push(group);
    }
    
    // 每组取代表色
    return groups.map(group => {
        // 取中间亮度的颜色
        group.sort((a, b) => {
            const la = a.rgb[0] * 0.299 + a.rgb[1] * 0.587 + a.rgb[2] * 0.114;
            const lb = b.rgb[0] * 0.299 + b.rgb[1] * 0.587 + b.rgb[2] * 0.114;
            return la - lb;
        });
        return group[Math.floor(group.length / 2)];
    });
}

// 找最近颜色
function findColor(r, g, b, palette) {
    if (r > 250 && g > 250 && b > 250) return null;
    
    const rgb = [r, g, b];
    let min = Infinity, best = palette[0];
    
    for (const c of palette) {
        const d = colorDistance(rgb, c.rgb);
        if (d < min) { min = d; best = c; }
    }
    return best;
}

// 匹配颜色并应用区域平滑
function matchColors(data, palette, simplifyLevel) {
    const w = data.width, h = data.height;
    
    // 颜色精简
    const threshold = simplifyLevel * 2.5; // 0-250 的阈值范围
    const simplifiedPalette = simplifyPalette(palette, threshold);
    console.log(`颜色精简: ${palette.length} → ${simplifiedPalette.length} 色`);
    
    const map = [], count = {};
    
    // 第一次遍历：基础匹配
    for (let i = 0; i < data.data.length; i += 4) {
        const c = findColor(data.data[i], data.data[i+1], data.data[i+2], simplifiedPalette);
        map.push(c);
    }
    
    // 第二次遍历：减少跳色（相邻颜色合并）
    const newMap = [...map];
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            const current = map[idx];
            if (!current) continue;
            
            // 检查周围8格
            const neighbors = [
                map[(y-1)*w + x-1], map[(y-1)*w + x], map[(y-1)*w + x+1],
                map[y*w + x-1], map[y*w + x+1],
                map[(y+1)*w + x-1], map[(y+1)*w + x], map[(y+1)*w + x+1]
            ].filter(c => c);
            
            if (neighbors.length === 0) continue;
            
            // 统计邻居颜色
            const neighborCount = {};
            neighbors.forEach(c => {
                neighborCount[c.code] = (neighborCount[c.code] || 0) + 1;
            });
            
            // 找最多的邻居颜色
            const sorted = Object.entries(neighborCount).sort((a, b) => b[1] - a[1]);
            const dominant = sorted[0];
            
            // 如果当前颜色只出现1次且与主流邻居颜色接近，则换成主流颜色
            if (dominant && dominant[1] >= 4 && current.code !== dominant[0]) {
                const dominantColor = simplifiedPalette.find(c => c.code === dominant[0]);
                if (dominantColor && colorDistance(current.rgb, dominantColor.rgb) < 80) {
                    newMap[idx] = dominantColor;
                }
            }
        }
    }
    
    // 统计颜色
    newMap.forEach(c => {
        if (c) count[c.code] = (count[c.code] || 0) + 1;
    });
    
    return { map: newMap, count, w, h, usedPalette: simplifiedPalette };
}

// 绘制图纸
function drawPattern(map, count, w, h, size, palette) {
    const margin = 30;
    const canvas = document.createElement('canvas');
    canvas.width = w * size + margin;
    canvas.height = h * size + margin;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 坐标
    ctx.fillStyle = '#333';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let x = 0; x < w; x += 5) ctx.fillText(x+1, margin + x*size + size/2, margin/2);
    ctx.textAlign = 'right';
    for (let y = 0; y < h; y += 5) ctx.fillText(y+1, margin - 6, margin + y*size + size/2);
    
    // 色块（先填充颜色，再统一画网格线）
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const c = map[y * w + x];
            const px = margin + x * size;
            const py = margin + y * size;
            
            ctx.fillStyle = c ? c.hex : '#ffffff';
            ctx.fillRect(px, py, size, size);
        }
    }
    
    // 绘制统一的网格线（清晰描边）
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) {
        ctx.beginPath();
        ctx.moveTo(margin + x * size, margin);
        ctx.lineTo(margin + x * size, margin + h * size);
        ctx.stroke();
    }
    for (let y = 0; y <= h; y++) {
        ctx.beginPath();
        ctx.moveTo(margin, margin + y * size);
        ctx.lineTo(margin + w * size, margin + y * size);
        ctx.stroke();
    }
    
    // 色号标注
    if (size >= 20) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const c = map[y * w + x];
                if (!c) continue;
                
                const px = margin + x * size + size/2;
                const py = margin + y * size + size/2;
                
                // 根据亮度选择文字颜色
                const brightness = c.rgb[0] * 0.299 + c.rgb[1] * 0.587 + c.rgb[2] * 0.114;
                ctx.fillStyle = brightness > 128 ? '#000' : '#fff';
                ctx.font = `bold ${Math.max(7, size/3)}px Arial`;
                ctx.fillText(c.code, px, py);
            }
        }
    }
    
    // 10格粗线
    ctx.strokeStyle = '#333333';
    ctx.lineWidth = 2;
    for (let x = 10; x < w; x += 10) {
        ctx.beginPath();
        ctx.moveTo(margin + x*size, margin);
        ctx.lineTo(margin + x*size, margin + h*size);
        ctx.stroke();
    }
    for (let y = 10; y < h; y += 10) {
        ctx.beginPath();
        ctx.moveTo(margin, margin + y*size);
        ctx.lineTo(margin + w*size, margin + y*size);
        ctx.stroke();
    }
    
    // 边框
    ctx.lineWidth = 3;
    ctx.strokeRect(margin, margin, w*size, h*size);
    
    return canvas;
}

// ============ 生成 ============
function generate() {
    if (!currentImage) return;
    
    const w = +document.getElementById('widthInput').value || 50;
    const h = +document.getElementById('heightInput').value || 50;
    const size = +document.getElementById('cellSizeSelect').value || 30;
    const simplifyLevel = +document.getElementById('simplifySlider').value || 50;
    
    // 初始化颜色库RGB值
    initPaletteRGB(currentPalette);
    
    document.getElementById('loading').classList.add('show');
    
    requestAnimationFrame(() => {
        try {
            const data = pixelate(currentImage, w, h);
            const { map, count, usedPalette } = matchColors(data, currentPalette, simplifyLevel);
            const canvas = drawPattern(map, count, w, h, size, usedPalette);
            
            const display = document.getElementById('patternCanvas');
            display.width = canvas.width;
            display.height = canvas.height;
            display.getContext('2d').drawImage(canvas, 0, 0);
            display._canvas = canvas;
            display._count = count;
            display._palette = usedPalette;
            
            showMaterials(count, usedPalette);
            document.getElementById('result').classList.add('show');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            console.error(e);
            alert('生成失败: ' + e.message);
        }
        document.getElementById('loading').classList.remove('show');
    });
}

function showMaterials(count, palette) {
    const total = Object.values(count).reduce((a, b) => a + b, 0);
    document.getElementById('totalBeads').textContent = total;
    document.getElementById('colorCount').textContent = Object.keys(count).length;
    
    const sorted = Object.entries(count).sort((a, b) => b[1] - a[1]);
    document.getElementById('materialItems').innerHTML = sorted.map(([code, n]) => {
        const c = palette.find(x => x.code === code);
        return `<div class="material-item"><div class="color-swatch" style="background:${c?.hex||'#fff'}"></div><span>${code}</span><span>${n}</span></div>`;
    }).join('');
}

function download() {
    const canvas = document.getElementById('patternCanvas')._canvas;
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = `拼豆图纸_${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function copyList() {
    const count = document.getElementById('patternCanvas')._count;
    if (!count) return;
    const total = Object.values(count).reduce((a, b) => a + b, 0);
    let text = `拼豆材料清单\n总珠数: ${total}\n颜色数: ${Object.keys(count).length}\n\n`;
    Object.entries(count).sort((a,b) => b[1]-a[1]).forEach(([c,n]) => text += `${c}: ${n}颗\n`);
    navigator.clipboard.writeText(text).then(() => alert('已复制'));
}
